<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大山ワンダー 下層WF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEC; --paper:#FFFFFF; --ink:#1E2328; --sub:#6A7882; --line:#C9CFD2; --box:#E3E6E6; --box2:#D3D8D9;
  --accent:#386A76; --accent-soft:#E2ECEE; --note:#FFF7DB; --note-ink:#6B5300;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-size:14px;line-height:1.6}
a{color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;background:#22303A;color:#E8EDEF;padding:22px 16px 40px}
nav.side h1{font-size:15px;margin:0 0 4px;letter-spacing:.06em}
nav.side .ver{font-size:11px;opacity:.6;margin-bottom:18px}
nav.side .grp{font-size:10px;letter-spacing:.2em;opacity:.55;margin:18px 0 6px}
nav.side a{display:block;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:13px;opacity:.88}
nav.side a:hover{background:rgba(255,255,255,.08)}
nav.side a.on{background:var(--accent);opacity:1}
nav.side a .id{display:inline-block;width:30px;opacity:.55;font-size:11px}
main{padding:28px 32px 80px;min-width:0}
.pagebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.pagebar h2{margin:0;font-size:22px;letter-spacing:.04em}
.pagebar .meta{font-size:12px;color:var(--sub)}
.pagebar .tags span{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 10px;margin-left:6px;background:#fff}
.purpose{background:#fff;border-left:3px solid var(--accent);padding:12px 16px;margin-bottom:18px;font-size:13px;border-radius:0 8px 8px 0}
.purpose b{color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.canvas{background:var(--paper);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.notes{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.notes h3{font-size:12px;letter-spacing:.2em;color:var(--sub);margin:0 0 8px}
.note{background:var(--note);color:var(--note-ink);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.65}
.note .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#E0B400;color:#fff;font-size:11px;align-items:center;justify-content:center;margin-right:6px;font-weight:700}
.note .src{display:block;margin-top:4px;color:#7A6A2A;font-size:11.5px}
/* ---- wire blocks ---- */
.blk{position:relative;padding:28px 48px;border-bottom:1px dashed #E1E5E6}
.blk.flush{padding:0}
.pin{position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:50%;background:#E0B400;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 0 0 3px #fff}
.lbl{font-size:10px;letter-spacing:.24em;color:var(--sub);margin-bottom:8px}
.ph{background:var(--box);position:relative;border-radius:6px;overflow:hidden;color:#8A949A;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center}
.ph::before,.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .5px),#CDD3D5 50%,transparent calc(50% + .5px))}
.ph::after{background:linear-gradient(to top left,transparent calc(50% - .5px),#CDD3D5 50%,transparent calc(50% + .5px))}
.ph span{position:relative;z-index:1;background:var(--box);padding:2px 8px;border-radius:4px}
.ln{height:9px;background:var(--box2);border-radius:5px;margin:7px 0}
.h{font-weight:700;letter-spacing:.04em}
.ttl{font-size:26px;font-weight:500;letter-spacing:.06em;margin:4px 0 8px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:12px;margin:0 6px 6px 0;background:#fff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.4px solid var(--accent);color:var(--accent);border-radius:24px;padding:9px 22px;font-size:13px;letter-spacing:.08em;background:#fff}
.btn.fill{background:var(--accent);color:#fff}
.btn.dark{background:#1E2328;border-color:#1E2328;color:#fff}
.grid{display:grid;gap:18px}
.card .cap{font-size:13px;margin-top:8px}
.card .meta{font-size:11px;color:var(--sub)}
.row{display:flex;gap:18px;align-items:center}
.gh{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#F4F5F4;border-bottom:1px solid #E1E5E6;font-size:12px}
.gh .logo{width:110px;height:30px}
.gh nav span{margin:0 9px;color:#4A565C}
.gf{background:#5E7A82;color:#fff;padding:26px 48px;font-size:12px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:20px}
.gf div div{opacity:.75;margin:3px 0}
.bc{font-size:11px;color:var(--sub);padding:12px 48px;border-bottom:1px dashed #E1E5E6}
.field{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:#fff;font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
.field b{color:var(--ink);font-weight:500}
.kv{display:grid;grid-template-columns:140px 1fr;border-top:1px solid #E1E5E6}
.kv div{padding:10px 12px;border-bottom:1px solid #E1E5E6;font-size:13px}
.kv div:nth-child(odd){background:#F6F7F7;color:var(--sub)}
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:var(--accent-soft)}
.tl .stop{position:relative;display:grid;grid-template-columns:140px 1fr;gap:16px;margin-bottom:18px}
.tl .stop::before{content:attr(data-n);position:absolute;left:-30px;top:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px;margin-bottom:16px}
.tabs span{padding:8px 16px;font-size:13px;color:var(--sub)}
.tabs span.on{border-bottom:2px solid var(--accent);color:var(--ink)}
.side2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;align-items:start}
.box{border:1px solid var(--line);border-radius:10px;padding:18px;background:#fff}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps div{flex:1;text-align:center;font-size:12px;padding:8px;border-radius:6px;background:#F1F3F3;color:var(--sub)}
.steps div.on{background:var(--accent);color:#fff}
.sp-note{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:6px 10px;margin-top:12px}
/* overview */
.ov{background:#fff;border-radius:8px;padding:24px 28px;margin-bottom:18px}
.ov h3{margin:0 0 12px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{border-bottom:1px solid #E6E9EA;padding:8px 8px;text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.1em;color:var(--sub);font-weight:500;background:#F6F7F7}
table.t a{color:var(--accent)}
.tree{font-size:13px;line-height:2}
.tree .l1{font-weight:700}
.tree .l2{padding-left:20px}
.tree .l3{padding-left:40px;color:var(--sub)}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.notes{position:static;max-height:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr} nav.side{position:static;height:auto}
  main{padding:16px}
  .blk{padding:22px 18px}
  .grid{grid-template-columns:1fr 1fr !important}
  .side2{grid-template-columns:1fr}
  .gf{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<script>
/* ============ ページ定義 ============ */
const PH=(label,h,extra='')=>`<div class="ph" style="height:${h}px;${extra}"><span>${label}</span></div>`;
const L=(n,w=[100,92,96,70])=>Array.from({length:n},(_,i)=>`<div class="ln" style="width:${w[i%w.length]}%"></div>`).join('');
const chips=(arr,on=-1)=>arr.map((c,i)=>`<span class="chip${i===on?' on':''}">${c}</span>`).join('');
const card=(img,h,cap,meta='')=>`<div class="card">${PH(img,h)}<div class="cap">${cap}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;
const grid=(cols,items)=>`<div class="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${items.join('')}</div>`;
const head=(en,title,lead)=>`<div class="lbl">${en}</div><div class="ttl">${title}</div>${lead?`<div style="color:var(--sub);font-size:13px;max-width:640px">${lead}</div>`:''}`;
const GH=`<div class="gh"><div class="ph logo"><span>LOGO</span></div><nav><span>大山ワンダーとは</span><span>探す</span><span>めぐる</span><span>知る</span><span>出会う</span><span>エリア</span><span>読みもの</span></nav><div class="row" style="gap:8px"><span>IG</span><span>YT</span><span class="btn fill" style="padding:5px 12px;font-size:11px">プランを探す →</span></div></div>`;
const GF=`<div class="gf"><div><b>探す</b><div>絶景／グルメ／温泉／登山</div><div>ドライブ／家族旅／雨の日</div></div><div><b>めぐる</b><div>水・発酵・神話・刀・海をめぐる旅</div><div>季節で探す（春夏秋冬）</div></div><div><b>知る</b><div>物語 5つ</div><div>大山ワンダーとは／地域の人／エリア紹介</div><div>読みもの／お知らせ／イベント／アクセス</div></div><div><b>PLAN &amp; RESERVE</b><div>プランを探す／ご予約の流れ</div><div>IG / YT</div></div><div style="grid-column:1/-1;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;opacity:.85">当サイトについて／お問い合わせ／各観光エリアお問い合わせ／山陰観光リンク／写真データ・レンタル／プライバシーポリシー／デジタルカタログ／Language</div></div>`;

/* blocks: {h:html, n:'注記', src:'移行元', flush:bool} */
const P = [
{id:'00',grp:'概要',name:'ページ一覧・方針',overview:true},

{id:'01',grp:'ブランド',name:'大山ワンダーとは',url:'/about/',tpl:'固定ページ',
 purpose:'ブランドの考え方と「めぐり」の世界観を伝え、Discover・物語へ送り出す。初めて来た人の入口。',
 blocks:[
  {h:PH('メインビジュアル（大山〜日野川〜海の空撮 or 動画）',320,'border-radius:0'),flush:true,n:'トップFVと同じ世界観。コピー「1300年つづく、山の記憶を旅する。」',src:'企画書 4-3'},
  {h:head('ABOUT','大山ワンダーとは')+`<div style="margin-top:14px">${L(6)}</div>`,n:'ブランドストーリー全文（「1300年前から〜めぐりに出会う旅である。」）。明朝・中央寄せで読み物として。',src:'企画書 4-3 ブランドストーリー'},
  {h:`<div class="lbl">MEGURI</div><div class="h" style="margin-bottom:12px">山 → 森 → 川 → 里 → 海 のめぐり図</div>${PH('図解：水の循環と5つの物語（森・信仰・鉄・水・海）の位置づけ',260)}`,n:'水の循環に沿って「5つの物語」「5つのテーマ」がどこに位置するかを図解。各要素から物語詳細へリンク。',src:'新規制作'},
  {h:`<div class="lbl">10 TOWNS</div><div class="h" style="margin-bottom:12px">大山山麓・日野川流域の10市町村</div>${PH('流域マップ（10市町村）',220)}<div style="margin-top:12px">${chips(['米子市','境港市','日吉津村','大山町','伯耆町','南部町','江府町','日野町','日南町','倉吉市'])}</div>`,n:'エリア詳細へのリンクを兼ねる。',src:'トップMapと共通部品'},
  {h:`<div class="side2"><div><div class="lbl">LOGO</div><div class="h">ロゴに込めた想い</div>${L(4)}</div>${PH('ロゴ（タテ組）',160)}</div>`,n:'旧「ロゴに込めた意味」ページを統合。新ロゴの説明に差し替え。',src:'/policy/logo/ → 統合'},
  {h:`<div class="lbl">HOW TO USE</div><div class="h" style="margin-bottom:12px">このサイトの使い方</div>${grid(3,['気分から探す','テーマでめぐる','物語を知る'].map(t=>`<div class="box"><b>${t}</b>${L(2)}</div>`))}`,n:'Discover／Thema／Storiesの3つの入口を説明。「気分から探す」「テーマでめぐる」はプランの検索結果（/plan/?filter=mood・theme）へ。',src:'企画書 6-1'},
  {h:`<div class="row" style="justify-content:center;gap:14px"><span class="btn fill">旅を探す →</span><span class="btn">観光タクシー旅を見る →</span></div>`,n:'回遊用CTA（直帰率72%対策）。'},
 ]},

{id:'02',grp:'探す・めぐる',name:'プラン一覧（検索・絞り込み）',url:'/plan/',tpl:'アーカイブ（CPT: plan）',
 purpose:'観光タクシー23コースを、出発地・気分・季節・テーマ・時間から探せるようにする。<b>気分・季節・テーマには専用ページを作らず、この検索結果に集約する</b>（トップ・メニューの気分／季節／テーマのカード、「すべての〜」、「探してみる」「プランを探す」の着地点）。URLパラメータで絞り込んだ状態を開く（?mood=zekkei・?season=autumn・?axis=katana で選択済み、?filter=mood／season／axis で該当の選択肢を開くだけ）。テーマの条件名は WordPress の予約語 theme を避けて axis（物語・ジャーナルと共通）。ページ送りは WordPress 標準の /plan/page/2/。条件が1つだけのときは、その条件の特集記事（ジャーナル）の紹介を<b>一覧の下</b>に出す。',
 blocks:[
  {h:head('PLAN','観光タクシー旅プラン','大山山麓ぐる〜んと観光タクシー旅。通常料金の約4割引き、乗車特典付き。'),n:'ページ見出し。運行期間（2026/4/25〜2027/3/31）と料金を併記。',src:'/taxi/ トップ文'},
  {h:`<div style="border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr 1fr 1fr">${[['出発地','米子駅'],['到着地','指定なし'],['ご利用日','2026/11/08'],['気分','指定なし ▾'],['季節','指定なし ▾'],['テーマ','刀 ▾'],['所要時間','指定なし ▾']].map((x,k)=>`<div style="padding:10px 12px;${k?'border-left:1px solid var(--line)':''}"><div style="font-size:10px;color:var(--sub)">${x[0]}</div><b style="font-size:13px;font-weight:500">${x[1]}</b></div>`).join('')}</div>`,n:'<b>条件バー（横一列）</b>。左の絞り込み列はやめ、一覧の上に1行で置く。出発地・到着地・ご利用日は選択／日付、気分・季節・テーマ・所要時間は押すと下に選択肢（チップ）が開く。選ぶとすぐ一覧が変わる（「探す」ボタンなし）。日付を入れると運休中のコースを除外。人数欄と現行ジャンルの絞り込みはなし（1台4名までは「ご利用の前に」へ）。1180px以下は「条件で絞り込む」ボタン→下からシート。',src:'/taxi/ コース検索（発着地）'},
  {h:`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div style="font-size:12px"><b style="font-size:22px;font-weight:400">3</b> コース　<span class="chip on">刀 ✕</span></div><div style="font-size:12px;color:var(--sub)">並び順 <b style="color:var(--ink)">おすすめ ▾</b></div></div>${grid(3,[['A-2　刀','童子切安綱を生んだ伯耆安綱ゆかりの地めぐり','米子駅 → 米子駅　|　5時間 ／ 18,000円'],['A-3　水・神話・刀','開運祈願とたたらの歴史にふれる旅','4〜5時間 ／ 15,000円〜'],['D-2　神話・刀','開運神社めぐり(1)','4〜5時間 ／ 15,000円〜']].map(c=>card('写真（NEWは左上に帯）',120,c[1],c[0]+' ／ '+c[2])))}`,n:'カードは箱に入れず写真＋文字（トップの季節・テーマと同じ組み方）：写真→コードと軸→タイトル→発着・時間→特典・運休（色の点＋文字）→特別料金／通常料金。気分/季節/テーマのタグは整理表「タクシープラン」シートの案をもとに付与。テーマの絞り込みは「つながりの軸」のタグ（水・発酵・神話・刀・海）をそのまま使う。12件ごとにページ送り（/plan/page/2/）。WPでは全件を出力してJSで表示を切り替え、URLの条件は pre_get_posts でサーバー側でも絞り込む。',src:'企画書 6-6 WF／整理表 タクシープラン'},
  {h:`<div class="box" style="background:#F4F7F7"><div class="side2" style="grid-template-columns:260px minmax(0,1fr)">${PH('特集のアイキャッチ',150)}<div><div class="lbl">FEATURE ／ 特集</div><div class="h" style="font-size:18px;margin-bottom:6px">刀をめぐる旅 ― 鉄が生んだ、暮らしと文化。</div>${L(3)}<div class="row" style="gap:10px;margin-top:10px"><span class="btn">特集を読む →</span><span style="font-size:12px;color:var(--sub)">▶ 動画：伯耆国に眠る名刀の記憶（語り：中村悠一）</span></div></div></div></div>`,n:'<b>選んだ条件の特集（条件が1つのときだけ、一覧とページ送りの下）</b>。/plan/?axis=katana なら、軸「刀」が付いた特集記事のうち「検索結果に出す」にチェックした1本を表示：アイキャッチ・抜粋・動画（任意）・「特集を読む」。条件が2つ以上、または該当する特集がない場合は出さず一覧だけ。特集本体はジャーナル（/journal/katana/ など）で、管理画面の投稿として作る。',src:'旧 テーマ詳細・気分・季節の素材（/tatara/・/topics/sake_poroject_x/・/onsen/・/12/・/autumnleaves_movie/・/13/ ほか）は特集記事へ'},
  {h:`<div class="grid" style="grid-template-columns:1fr 1fr 1fr">${['ご利用期間・料金','ご利用前の注意事項','乗車特典一覧／パンフレット（5言語）'].map(t=>`<div class="box"><b>${t}</b>${L(3)}</div>`).join('')}</div>`,n:'現 /taxi/ の「ご利用前に必ずお読みください」を折りたたみで残す。tabiwa by WESTER の販売案内もここ。',src:'/taxi/ 注意事項'},
  {h:`<div class="row" style="justify-content:space-between"><div><b>タクシー会社へのお問い合わせ</b><div style="font-size:12px;color:var(--sub)">7社の電話番号／問い合わせフォーム（1本化）</div></div><span class="btn">お問い合わせ一覧 →</span></div>`,n:'旧7フォームは「会社を選ぶ」1フォームに統合。',src:'/taxi/n142/ ほか7ページ'},
  {h:`<div class="sp-note">SP：条件バーは「条件で絞り込む」ボタン→下からシート（出発地・到着地・ご利用日と、気分・季節・テーマ・所要時間のチップ）。カードは1列。特集の紹介は一覧の下で写真を上にして1列。</div>`},
 ]},
{id:'03',grp:'探す・めぐる',name:'プラン詳細',url:'/plan/a-2/',tpl:'詳細（CPT: plan）',

  <div class="purpose"><b>前提</b>：トップデザイン（v2）と同じ部品・トンマナで下層を組む。PCレイアウトを基準に描き、SPの変化は各ページの緑の注記で示す。黄色の番号は右の注記と対応。「移行元」は現サイトのURL（詳細は「大山ワンダー_コンテンツ整理表.xlsx」）。</div>
  <div class="ov"><h3>サイトマップ（企画書 6-3 をもとに整理）</h3><div class="tree">
    <div class="l1">トップ</div>
    <div class="l2">大山ワンダーとは</div>
    <div class="l2">探す・めぐる：プラン一覧 → プラン詳細 → 予約フォーム</div>
    <div class="l3">気分（7）／季節（4）／テーマ（5）は専用ページを作らず、プラン一覧の絞り込み（検索結果）で表示。条件が1つのときは特集記事の導入を上に出す</div>
    <div class="l2">知る：物語一覧 → 物語詳細（水・森・信仰・鉄・海）</div>
    <div class="l2">出会う：地域の人 一覧 → 詳細（5名〜）</div>
    <div class="l2">エリア紹介 → エリア詳細（10市町村）</div>
    <div class="l2">ジャーナル（特集・コラム・インタビュー・動画）／イベント／お知らせ（各 一覧・詳細）</div>
    <div class="l2">アクセス／当サイトについて・プライバシーポリシー／各観光エリアお問い合わせ／山陰観光リンク／写真データ・レンタル／お問い合わせ</div>
  </div></div>
  <div class="ov"><h3>WordPress のデータ設計（案）</h3>
    <table class="t"><tr><th>種別</th><th>名前</th><th>主な項目</th><th>件数（初期）</th></tr>
    <tr><td>CPT</td><td>plan（観光タクシープラン）</td><td>コード・ジャンル・所要時間・出発条件・発着地・料金/通常料金・運休期間・特典・立ち寄りスポット（spotの並び）</td><td>23（＋未掲載1）</td></tr>

    <tr><td>CPT</td><td>story（物語）</td><td>本文・章・登場スポット・関連人物</td><td>5</td></tr>
    <tr><td>CPT</td><td>person（地域の人）</td><td>氏名・肩書き・所属スポット・インタビュー本文</td><td>5〜</td></tr>
    <tr><td>CPT</td><td>event（イベント）</td><td>開催期間・会場・エリア・料金・主催・外部URL</td><td>随時</td></tr>

    <tr><td>タクソノミー</td><td>mood（気分）/ season（季節）/ area（市町村）</td><td>plan・spot・event・journalに共通で付与</td><td>7 / 4 / 10</td></tr>

    </table></div>
  <div class="ov"><h3>テンプレート一覧（${P.length-1}）</h3><table class="t"><tr><th>No</th><th>ページ</th><th>URL（案）</th><th>テンプレート</th><th>目的</th></tr>${rows}</table></div>

    <li>F-4（ご当地ソフト食べ比べ）の運行有無（現サイトの一覧に未掲載）</li>
    <li>事業者向けお知らせ（酒蔵ツーリズムの過去記事）を新サイトに残すか</li>
    <li>刀剣たたら特集の図版・画像（東京国立博物館、chiikimirai）の使用許諾</li>
    <li>「地域の人」「森の物語」「海の物語」の取材・撮影スケジュール</li>
  </ol></div>`;

/* ============ 描画 ============ */
function renderSide(cur){
  let html=`<h1>大山ワンダー 下層WF</h1><div class="ver">v3 ／ 2026-10-19</div>`;
  let g='';
  P.forEach(p=>{ if(p.grp!==g){g=p.grp;html+=`<div class="grp">${g}</div>`;} html+=`<a href="#${p.id}" class="${p.id===cur?'on':''}"><span class="id">${p.id}</span>${p.name}</a>`; });
  document.getElementById('side').innerHTML=html;
}
function render(){
  const id=(location.hash||'#00').slice(1);
  const p=P.find(x=>x.id===id)||P[0];
  renderSide(p.id);
  const m=document.getElementById('main');
  if(p.overview){ m.innerHTML=overview(); window.scrollTo(0,0); return; }
  let k=0, notes='';
  const body=p.blocks.map(b=>{
    let pin='';
    if(b.n||b.src){ k++; pin=`<div class="pin">${k}</div>`; notes+=`<div class="note"><span class="n">${k}</span>${b.n||''}${b.src?`<span class="src">移行元・参照：${b.src}</span>`:''}</div>`; }
    return `<div class="blk${b.flush?' flush':''}">${pin}${b.h}</div>`;
  }).join('');
  m.innerHTML=`<div class="pagebar"><h2>${p.id}　${p.name}</h2><div class="meta">${p.url}<span class="tags"><span>${p.tpl}</span></span></div></div>
  <div class="purpose"><b>このページの役割</b>　${p.purpose}</div>
  <div class="stage"><div class="canvas">${GH}${p.id!=='01'?`<div class="bc">トップ ＞ ${p.name}</div>`:''}${body}${GF}</div><aside class="notes"><h3>NOTES</h3>${notes||'<div class="note">注記なし</div>'}</aside></div>`;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
